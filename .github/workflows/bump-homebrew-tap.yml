name: Bump Homebrew Tap

# Triggered when a new agent version is tagged. Updates the Formula in
# orchestratiahq/homebrew-tap with the new URL + sha256, then commits.
# Mac users running `brew upgrade orchestratia-agent` get the new version
# on their next `brew update`.
#
# Requires repo secret HOMEBREW_TAP_PAT — a fine-grained PAT (or classic
# PAT with `repo` scope) that has write access to orchestratiahq/homebrew-tap.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump to (without v prefix). Leave blank to use latest tag.'
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Download release tarball + compute sha256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/kumarimlab/orchestratia-agent/archive/refs/tags/v${VERSION}.tar.gz"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o /tmp/agent.tar.gz
          SHA=$(sha256sum /tmp/agent.tar.gz | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: orchestratiahq/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: Update Formula
        run: |
          cd tap
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha }}"
          FORMULA="Formula/orchestratia-agent.rb"
          # Replace the URL line (matches any vX.Y.Z in the URL)
          sed -i -E "s|archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz|archive/refs/tags/v${VERSION}.tar.gz|" "$FORMULA"
          # Replace the sha256 line (matches the first occurrence — the main URL's sha)
          sed -i -E "0,/sha256 \"[a-f0-9]{64}\"/s||sha256 \"${SHA}\"|" "$FORMULA"
          echo "--- updated Formula ---"
          head -10 "$FORMULA"

      - name: Commit + push
        run: |
          cd tap
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "Orchestratia Bot"
          git config user.email "bot@orchestratia.com"
          if git diff --quiet; then
            echo "No changes to Formula — already at v${VERSION}"
            exit 0
          fi
          git add Formula/orchestratia-agent.rb
          git commit -m "orchestratia-agent ${VERSION}"
          git push

      # The steps above all authenticate with HOMEBREW_TAP_PAT, so they succeed
      # whether or not anyone else can reach the tap. The tap was in fact
      # PRIVATE for months while this workflow reported success on every
      # release — `brew install orchestratiahq/tap/orchestratia-agent` failed
      # for every user, and nothing surfaced it.
      #
      # This step therefore uses NO token. It is the only check here that
      # proves what a real Mac user experiences.
      - name: Verify the tap is reachable ANONYMOUSLY
        env:
          # Ensure no ambient credentials leak into these commands.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAP_URL="https://github.com/orchestratiahq/homebrew-tap.git"

          echo "==> Anonymous clone (this is what 'brew tap' does)"
          # Clone rather than hit raw.githubusercontent: the raw CDN caches for
          # minutes and would give a false failure right after a push.
          rm -rf /tmp/tapcheck
          if ! git -c credential.helper= -c http.extraheader= \
                 clone --depth 1 --quiet "$TAP_URL" /tmp/tapcheck; then
            echo "::error::The Homebrew tap is NOT publicly readable."
            echo "::error::'brew install orchestratiahq/tap/orchestratia-agent' will fail for every user."
            echo "::error::Fix: GitHub -> orchestratiahq/homebrew-tap -> Settings -> change visibility to Public."
            exit 1
          fi
          echo "    ok: anonymous clone succeeded"

          echo "==> Formula reflects v${VERSION}"
          FORMULA=/tmp/tapcheck/Formula/orchestratia-agent.rb
          if ! grep -q "archive/refs/tags/v${VERSION}.tar.gz" "$FORMULA"; then
            echo "::error::Formula does not reference v${VERSION} after the push:"
            grep -n "url " "$FORMULA" || true
            exit 1
          fi
          echo "    ok: formula points at v${VERSION}"

          echo "==> sha256 in the formula matches the real tarball"
          # A wrong hash passes every step above and fails only at `brew
          # install`, which is the same silent-breakage shape as the private tap.
          EXPECTED=$(grep -oE 'sha256 "[a-f0-9]{64}"' "$FORMULA" | head -1 | grep -oE '[a-f0-9]{64}')
          curl -fsSL -o /tmp/verify.tar.gz \
            "https://github.com/kumarimlab/orchestratia-agent/archive/refs/tags/v${VERSION}.tar.gz"
          ACTUAL=$(sha256sum /tmp/verify.tar.gz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::sha256 mismatch — brew install would abort."
            echo "::error::formula=$EXPECTED actual=$ACTUAL"
            exit 1
          fi
          echo "    ok: sha256 matches ($ACTUAL)"

          echo "==> Tap verified end to end as an unauthenticated user"
